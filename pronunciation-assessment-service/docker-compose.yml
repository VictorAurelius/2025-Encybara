services:
  pronunciation-assessment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pronunciation-assessment-service-whisperx
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - PORT=5000
      - FLASK_ENV=production
      # WhisperX specific environment variables
      - WHISPERX_DEVICE=cpu
      - WHISPERX_COMPUTE_TYPE=float32
      # Fix for ctranslate2 executable stack issue
      - CT2_FORCE_CPU_ISA=""
    # Security settings to allow executable stack for ctranslate2
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    privileged: true
    volumes:
      # Mount logs for persistence (optional)
      - ./logs:/app/logs
      # Mount temp directory for audio processing
      - ./temp:/app/temp
      # Mount models directory for WhisperX cache
      - whisperx-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s  # Reduced from 180s due to faster WhisperX startup
    restart: unless-stopped
    networks:
      - pronunciation-network
    deploy:
      resources:
        limits:
          memory: 4G  # WhisperX can be more memory efficient than MFA
          cpus: '2.0'
        reservations:
          memory: 1G  # Reduced reservation
          cpus: '0.5'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pronunciation.rule=Host(`pronunciation.localhost`)"
      - "traefik.http.services.pronunciation.loadbalancer.server.port=5000"

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: pronunciation-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - pronunciation-network
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: pronunciation-grafana
    ports:
      - "3101:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - pronunciation-network
    profiles:
      - monitoring

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: pronunciation-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - pronunciation-network
    profiles:
      - caching

  # NGINX reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: pronunciation-nginx
    ports:
      - "81:80"
      - "444:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - pronunciation-assessment-service
    networks:
      - pronunciation-network
    profiles:
      - proxy

  # Ngrok for exposing local service to the internet (optional)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: pronunciation-ngrok
    ports:
      # Ngrok web interface for inspecting traffic
      - "4041:4040"
    volumes:
      # Mount the ngrok config file
      - ./ngrok/ngrok.yml:/etc/ngrok.yml
    command:
      # Start the tunnel defined in ngrok.yml
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    # Add extra_hosts to allow ngrok to reach host services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pronunciation-network
    profiles:
      # Use --profile tunnel to run this service
      - tunnel

volumes:
  grafana-storage:
    driver: local
  redis-data:
    driver: local
  whisperx-models:
    driver: local

networks:
  pronunciation-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16