# Content Scoring Service Configuration
# Use host.docker.internal to reach services on host machine from container
content-scoring.service.url=${CONTENT_SCORING_SERVICE_URL:http://host.docker.internal:5001}
content-scoring.service.timeout.connect=15
content-scoring.service.timeout.read=30

# Pronunciation Assessment Service Configuration  
# Use host.docker.internal to reach services on host machine from container
pronunciation-assessment.service.url=${PRONUNCIATION_SERVICE_URL:http://host.docker.internal:5000}
pronunciation-assessment.service.timeout.connect=30
pronunciation-assessment.service.timeout.read=60

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Metrics Configuration - Fix for Docker/Container environments
# Disable processor metrics to avoid NullPointerException in cgroup environments
management.metrics.enable.processor=false
# Optional: Disable system metrics entirely if not needed
# management.metrics.enable.system=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# Swagger UI Customization
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=-1

# API Information
springdoc.swagger-ui.display-request-duration=true
