global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'content-scoring-service'
    static_configs:
      - targets: ['content-scoring:5001']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s

  - job_name: 'content-scoring-health'
    static_configs:
      - targets: ['content-scoring:5001']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 5s