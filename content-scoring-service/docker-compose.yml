services:
  content-scoring-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-scoring-service
    ports:
      - "5001:5001"
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - PORT=5001
    volumes:
      # Mount logs for persistence (optional)
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - content-scoring-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.content-scoring.rule=Host(`content-scoring.localhost`)"
      - "traefik.http.services.content-scoring.loadbalancer.server.port=5001"

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: content-scoring-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - content-scoring-network
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: content-scoring-grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - content-scoring-network
    profiles:
      - monitoring

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: content-scoring-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - content-scoring-network
    profiles:
      - caching

  # NGINX reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: content-scoring-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - content-scoring-service
    networks:
      - content-scoring-network
    profiles:
      - proxy

  # Ngrok for exposing local service to the internet (optional)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: content-scoring-ngrok
    ports:
      # Ngrok web interface for inspecting traffic
      - "4040:4040"
    volumes:
      # Mount the ngrok config file
      - ./ngrok/ngrok.yml:/etc/ngrok.yml
    command:
      # Start the tunnel defined in ngrok.yml
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    # Add extra_hosts to allow ngrok to reach host services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - content-scoring-network
    profiles:
      # Use --profile tunnel to run this service
      - tunnel

volumes:
  grafana-storage:
    driver: local
  redis-data:
    driver: local

networks:
  content-scoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16